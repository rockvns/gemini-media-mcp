name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & Validate
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Self-Test Suite
        run: |
          python test_gemini_server.py

  build-windows-exe:
    name: Build Windows Executable
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build One-Directory Binary
        run: |
          pyinstaller --noconfirm --onedir --console `
            --name "gemini-media-mcp" `
            --collect-all "mcp" `
            --collect-all "google.genai" `
            gemini_mcp.py

      - name: Copy Config Templates to Distribution Directory
        run: |
          Copy-Item .env.example dist/gemini-media-mcp/
          Copy-Item user_preferences.json dist/gemini-media-mcp/

      - name: Compress Directory Distribution
        run: |
          Compress-Archive -Path dist/gemini-media-mcp -DestinationPath dist/gemini-media-mcp-windows-x64.zip -Force

      - name: Build Single-File Standalone Executable
        run: |
          pyinstaller --noconfirm --onefile --console `
            --name "gemini-media-mcp-standalone" `
            --collect-all "mcp" `
            --collect-all "google.genai" `
            gemini_mcp.py

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-media-mcp-windows-binaries
          path: |
            dist/gemini-media-mcp-windows-x64.zip
            dist/gemini-media-mcp-standalone.exe

  build-package:
    name: Build Python Package (Wheel & Sdist)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Wheel & Sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-media-mcp-python-package
          path: dist/*

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [build-windows-exe, build-package]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Tag and Release Information
        id: tag_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            NAME="Release ${TAG}"
            IS_PRERELEASE="false"
          else
            # Extract version from setup.py
            PKG_VER=$(python -c "import re; m = re.search(r'version=[\"\'\']([^\"\'\']+)[\"\'\']', open('setup.py').read()); print(m.group(1) if m else '2.2.0')")
            BASE_TAG="v${PKG_VER}"
            
            # Check if tag already exists in the repository
            if git rev-parse "refs/tags/${BASE_TAG}" >/dev/null 2>&1; then
              TAG="${BASE_TAG}-build.${{ github.run_number }}"
              NAME="Build ${BASE_TAG} (#${{ github.run_number }})"
              IS_PRERELEASE="true"
            else
              TAG="${BASE_TAG}"
              NAME="Release ${BASE_TAG}"
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gemini-media-mcp-windows-binaries
          path: release-assets/

      - name: Download Python Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gemini-media-mcp-python-package
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag_name }}
          name: ${{ steps.tag_info.outputs.release_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag_info.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.tag_info.outputs.is_prerelease != 'true' }}
